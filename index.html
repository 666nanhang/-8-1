<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>周帅杭 · 简历</title>
    <style>
        /* ===== 极客星空·设计令牌 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 赛博朋克蓝 + 亮橙强调色 */
            --primary: #00f0ff; 
            --primary-soft: rgba(0, 240, 255, 0.15);
            --accent: #ff5e00; 
            --accent-soft: rgba(255, 94, 0, 0.2);
            --bg: #030811; /* 深邃黑蓝 */
            --surface: rgba(10, 18, 35, 0.6);
            --text: #e2e8f0;
            --text-light: #8b9bb4;
            --border: rgba(0, 240, 255, 0.15);
            --card-bg: rgba(8, 14, 26, 0.5);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            --shadow-hover: 0 0 25px rgba(0, 240, 255, 0.25);
            --gradient-text: linear-gradient(to right, #ffffff, #a0aec0);
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        /* 纯净深色背景 (无粒子) */
        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        html { scroll-behavior: smooth; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* 导航 */
        .navbar {
            position: fixed; top: 0; left: 0; width: 100%; background: rgba(3, 8, 17, 0.7);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border); z-index: 1000; padding: 12px 0;
        }
        .nav-container { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .nav-logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 2px; color: #fff; text-transform: uppercase; }
        .nav-logo span { color: var(--primary); }
        .nav-center { display: flex; gap: 8px 16px; flex-wrap: wrap; justify-content: center; }
        .nav-center a { color: var(--text-light); text-decoration: none; font-size: 0.95rem; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.3s; }
        .nav-center a:hover { color: var(--primary); background: var(--primary-soft); }
        .icon-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 38px; height: 38px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.3s; }
        .icon-btn:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }

        .main-content { margin-top: 100px; }

        /* =========================================================
           🌟 工业级：骨架屏加载占位 (Skeleton Progressive Loading)
           ========================================================= */
        .img-skeleton {
            background-color: rgba(10, 18, 35, 0.9) !important;
            background-image: linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.08) 20%, transparent 40%) !important;
            background-size: 200% 100% !important;
            animation: skeleton-scan 1.5s infinite linear !important;
            color: transparent !important; /* 加载时隐藏原生的破碎图标和alt文本 */
            min-height: 100px; /* 保证没加载出图片时有一个默认的物理高度撑起排版 */
        }
        @keyframes skeleton-scan {
            0% { background-position: 100% 0; }
            100% { background-position: -100% 0; }
        }

        /* ===== Hero 核心区 ===== */
        .hero-section { padding: 60px 0 80px 0; }
        .hero-top-layout { display: flex; justify-content: space-between; align-items: flex-start; gap: 30px; }
        .hero-left-content { flex: 1; max-width: 100%; } 
        .hero-right-content { flex-shrink: 0; padding: 8px; background: rgba(10, 18, 35, 0.4); border: 2px solid rgba(255, 255, 255, 0.08); border-radius: 18px; backdrop-filter: blur(10px); box-shadow: var(--shadow); transition: all 0.3s ease; position: relative; z-index: 5; }
        .hero-right-content:hover { transform: translateY(-5px); border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .hero-formal-photo { display: block; width: clamp(110px, 15vw, 140px); height: auto; border-radius: 12px; object-fit: contain; }
        .hero-tag { font-size: 0.8rem; letter-spacing: 0.6em; color: var(--text-light); margin-bottom: 2rem; text-transform: uppercase; }
        .hero-main-row { display: flex; align-items: center; gap: 30px; margin-bottom: 1.5rem; flex-wrap: wrap; }
        .hero-name { font-size: clamp(3.5rem, 8vw, 6.5rem); font-weight: 900; line-height: 1; color: #fff; letter-spacing: -0.02em; margin: 0; }
        .hero-dot { color: var(--accent); }
        .hero-avatar { width: clamp(80px, 12vw, 120px); height: clamp(80px, 12vw, 120px); border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,0.9); box-shadow: 0 0 30px rgba(255,255,255,0.1), 0 0 50px rgba(0, 240, 255, 0.3); transition: transform 0.3s ease; }
        .hero-avatar:hover { transform: scale(1.05) rotate(5deg); }
        .hero-slogan { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 800; color: #94a3b8; margin-bottom: 2.5rem; letter-spacing: -0.01em; }
        
        /* 讨论区按钮及同行布局 */
        .hero-desc-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; flex-wrap: wrap; margin-bottom: 3.5rem; }
        .hero-desc-row .hero-desc { margin-bottom: 0; flex: 1; min-width: 300px; }
        .hero-desc { font-size: 1.15rem; line-height: 1.8; color: var(--text-light); max-width: 750px; }
        .hero-desc b { color: #fff; font-weight: 700; }
        
        .hero-discuss-wrap {
            position: relative;
            display: inline-block;
            padding: 8px; 
        }
        
        .hero-discuss-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: 
                linear-gradient(to right, #8bbbe5 2px, transparent 2px) 0 15px / 2px 15px no-repeat,
                linear-gradient(to bottom, #8bbbe5 2px, transparent 2px) 15px 0 / 15px 2px no-repeat,
                linear-gradient(to left, #8bbbe5 2px, transparent 2px) 100% 15px / 2px 15px no-repeat,
                linear-gradient(to bottom, #8bbbe5 2px, transparent 2px) calc(100% - 15px) 0 / 15px 2px no-repeat,
                linear-gradient(to right, #8bbbe5 2px, transparent 2px) 0 calc(100% - 15px) / 2px 15px no-repeat,
                linear-gradient(to top, #8bbbe5 2px, transparent 2px) 15px 100% / 15px 2px no-repeat,
                linear-gradient(to left, #8bbbe5 2px, transparent 2px) 100% calc(100% - 15px) / 2px 15px no-repeat,
                linear-gradient(to top, #8bbbe5 2px, transparent 2px) calc(100% - 15px) 100% / 15px 2px no-repeat;
            transition: all 0.3s;
        }

        .discuss-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #cbe5fa 0%, #8dc1eb 100%);
            color: #0b1118;
            font-size: 3rem;
            font-family: 'STKaiti', 'KaiTi', '楷体', 'Times New Roman', serif;
            font-weight: 900;
            padding: 10px 48px;
            letter-spacing: 6px;
            text-decoration: none;
            clip-path: polygon(18px 0, calc(100% - 18px) 0, 100% 18px, 100% calc(100% - 18px), calc(100% - 18px) 100%, 18px 100%, 0 calc(100% - 18px), 0 18px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }
        
        .discuss-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(180deg, #dcf0ff 0%, #a4d2f8 100%);
        }
        .hero-discuss-wrap:hover::before {
            transform: scale(1.03);
            opacity: 0.5;
        }
        
        .hero-contact-card { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 2.5rem; display: flex; gap: 3rem; flex-wrap: wrap; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .contact-item { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 220px; }
        .contact-label { font-size: 0.85rem; color: #64748b; font-weight: 600; }
        .contact-val { font-size: 1.25rem; font-weight: 700; font-family: 'Courier New', Courier, monospace; color: #fff; letter-spacing: 0.05em; }

        /* ===== 通用组件 ===== */
        .section-title { font-size: 1.8rem; margin-bottom: 1.5rem; color: #fff; font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .section-title::before { content: ''; display: block; width: 8px; height: 24px; background: var(--primary); border-radius: 4px; box-shadow: 0 0 10px var(--primary); }
        .card { background: var(--card-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 16px; padding: 28px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: all 0.3s ease; }
        .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-5px); border-color: rgba(0, 240, 255, 0.4); }

        /* =========================================================
           🌟 核心身份卡片区 
           ========================================================= */
        .sticky-wrapper { position: relative; height: 300vh; z-index: 10; }
        .sticky-content { position: -webkit-sticky; position: sticky; top: 0; width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .sticky-container { width: 100%; max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .role-cards-container { width: 100%; overflow: hidden; }
        .role-cards-track { display: flex; gap: 20px; --scroll-x: 0px; transform: translateX(var(--scroll-x)); will-change: transform; }

        .role-card {
            flex: 0 0 85%; max-width: 320px; aspect-ratio: 3 / 4.2; position: relative;
            border-radius: 24px; overflow: hidden; scroll-snap-align: center; text-decoration: none;
            border: 1px solid var(--border); box-shadow: var(--shadow); display: block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
        }

        .role-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.4);
            border-color: var(--primary);
        }
        
        .tech-bg-container { position: absolute; inset: 0; z-index: 1; overflow: hidden; }
        .tech-bg-1 { --theme-r: 0; --theme-g: 240; --theme-b: 255; background: linear-gradient(145deg, #01121a 0%, #021a2b 100%); }
        .tech-bg-2 { --theme-r: 0; --theme-g: 150; --theme-b: 255; background: linear-gradient(145deg, #010a1a 0%, #051633 100%); }
        .tech-bg-3 { --theme-r: 140; --theme-g: 80; --theme-b: 255; background: linear-gradient(145deg, #07021a 0%, #110533 100%); }
        
        .tech-grid {
            position: absolute; inset: 0;
            background-image: 
                radial-gradient(rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25) 1px, transparent 1px),
                radial-gradient(rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1) 1px, transparent 1px);
            background-size: 20px 20px, 40px 40px;
            background-position: 0 0, 10px 10px;
            opacity: 0.6;
        }

        .tech-beam { position: absolute; background: linear-gradient(90deg, transparent, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.9), transparent); }
        .beam-1 { height: 1px; width: 200%; top: 25%; left: -50%; transform: rotate(-25deg); box-shadow: 0 0 15px 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.6); }
        .beam-2 { height: 2px; width: 150%; top: 75%; left: -20%; transform: rotate(15deg); filter: blur(1px); opacity: 0.6; }
        .beam-horizontal { height: 3px; width: 150%; top: 50%; left: -25%; background: linear-gradient(90deg, transparent, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 1), transparent); filter: blur(2px); opacity: 0.8; box-shadow: 0 0 20px 3px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.8); animation: techPulse 3s infinite ease-in-out; }

        .tech-shape { position: absolute; border: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15); background: linear-gradient(135deg, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.05), transparent); }
        .shape-1 { width: 150px; height: 150px; top: -30px; right: -30px; transform: rotate(45deg); border-radius: 12px; animation: techFloat 6s infinite; }
        .shape-2 { width: 250px; height: 40px; bottom: 15%; left: -50px; transform: skewX(-45deg); }
        
        .tech-data { position: absolute; right: 24px; top: 40%; color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.4); font-family: 'Courier New', Courier, monospace; font-size: 10px; line-height: 1.6; text-align: right; letter-spacing: 2px; font-weight: bold; }
        .tech-data span { display: block; }

        @keyframes techPulse { 0%, 100% { opacity: 0.8; transform: scaleX(1); } 50% { opacity: 0.4; transform: scaleX(0.9); } }
        @keyframes techFloat { 0%, 100% { transform: translateY(0) rotate(45deg); } 50% { transform: translateY(10px) rotate(45deg); } }
        
        .role-card-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(3,8,17,0.7) 0%, rgba(3,8,17,0.1) 40%, rgba(3,8,17,0.98) 100%); z-index: 2; transition: background 0.3s; }
        .role-card:hover .role-card-overlay { background: linear-gradient(to bottom, rgba(3,8,17,0.5) 0%, rgba(3,8,17,0.05) 40%, rgba(3,8,17,0.95) 100%); }
        
        .role-card-content { position: relative; z-index: 3; display: flex; flex-direction: column; height: 100%; padding: 28px 24px; color: #fff; }
        
        .role-card-top { font-size: 0.9rem; font-weight: 600; letter-spacing: 1px; opacity: 0.95; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); font-family: 'Courier New', Courier, monospace; color: var(--primary); }
        .role-card-title { font-size: 2.2rem; font-weight: 900; line-height: 1.2; margin-top: auto; margin-bottom: 20px; text-shadow: 0 4px 15px rgba(0,0,0,0.9), 0 0 20px rgba(0, 240, 255, 0.4); display: flex; flex-direction: column; gap: 6px; }
        .role-card-bottom { font-size: 0.95rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; opacity: 0.95; transition: color 0.3s, transform 0.3s; }
        .role-card:hover .role-card-bottom { color: var(--primary); transform: translateX(6px); }

        /* ===== 核心经历 新版卡片式 UI ===== */
        .exp-list {
            display: flex;
            flex-direction: column;
            gap: 32px;
            margin-top: 10px;
        }
        .exp-card-new {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 480px; 
        }
        .exp-card-new:hover {
            border-color: var(--primary);
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0, 240, 255, 0.2);
        }
        
        .exp-card-img-wrap {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%; 
            z-index: 0;
            background: var(--bg);
        }
        .exp-card-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
            transition: transform 0.5s ease;
            cursor: zoom-in;
            display: block;
        }
        .exp-card-new:hover .exp-card-img-wrap img {
            transform: scale(1.05);
        }
        
        .exp-card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(3,8,17,0) 0%, rgba(3,8,17,0.3) 40%, rgba(3,8,17,0.85) 75%, rgba(3,8,17,0.98) 100%);
            z-index: 1;
            pointer-events: none; 
            transition: background 0.3s;
        }
        .exp-card-new:hover .exp-card-overlay {
            background: linear-gradient(to bottom, rgba(3,8,17,0) 0%, rgba(3,8,17,0.15) 40%, rgba(3,8,17,0.7) 75%, rgba(3,8,17,0.95) 100%);
        }
        
        .exp-card-content {
            padding: 40px 32px 32px 32px;
            position: relative;
            z-index: 2;
            margin-top: auto;
        }
        .exp-card-title {
            font-size: 1.6rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .exp-card-meta {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 20px;
            font-family: var(--font-mono);
        }
        .exp-card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .exp-card-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .exp-card-new:hover .exp-card-tag {
            border-color: var(--primary-soft);
            color: var(--primary);
            background: rgba(0, 240, 255, 0.05);
        }
        .exp-card-desc {
            font-size: 1.05rem;
            color: var(--text);
            line-height: 1.7;
        }
        .exp-card-arrow {
            position: absolute;
            bottom: 32px;
            right: 32px;
            color: var(--text-light);
            transition: all 0.3s;
        }
        .exp-card-new:hover .exp-card-arrow {
            color: var(--primary);
            transform: translate(4px, -4px);
        }

        /* 进度条 */
        .skill-item { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; }
        .skill-name { width: 100px; font-weight: 500; color: var(--text); font-size: 0.95rem; }
        .progress-bar { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 10px; box-shadow: 0 0 10px var(--primary); }

        /* 布局 */
        .grid-2, .grid-3 { display: grid; gap: 24px; margin-bottom: 40px; }
        
        /* 🌟 证书图片排版优化 */
        .cert-imgs { 
            display: flex; 
            gap: 20px; 
            margin-top: 24px; 
            flex-wrap: wrap; 
        }
        .cert-img-wrap {
            height: 220px; 
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        .cert-img-wrap:hover {
            transform: translateY(-5px) scale(1.02); 
            border-color: var(--primary); 
            box-shadow: 0 12px 30px rgba(0, 240, 255, 0.2);
        }
        .cert-img { 
            height: 100%; 
            width: auto;   
            max-width: 100%;
            cursor: zoom-in; 
            object-fit: cover; 
            display: block; 
        }

        @media (min-width: 768px) { 
            .grid-2 { grid-template-columns: repeat(2,1fr); } 
            .role-card { flex: 0 0 clamp(340px, 42%, 460px); max-width: none; aspect-ratio: 3 / 4.2; }
        }
        @media (min-width: 1024px) { .grid-3 { grid-template-columns: repeat(3,1fr); } }

        /* 返回顶部 */
        #back-to-top { position: fixed; bottom: 30px; right: 30px; background: rgba(0, 240, 255, 0.1); color: var(--primary); border: 1px solid var(--primary); width: 45px; height: 45px; border-radius: 8px; font-size: 20px; cursor: pointer; z-index: 999; transition: 0.3s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        #back-to-top:hover { background: var(--primary); color: #000; box-shadow: 0 0 20px var(--primary); }
        .footer { text-align: center; padding: 40px 0; border-top: 1px solid rgba(255,255,255,0.05); margin-top: 60px; color: var(--text-light); font-size: 0.9rem; }
        
        section { scroll-margin-top: 100px; }

        @media (max-width: 768px) {
            .container { padding: 0 16px; }
            .main-content { margin-top: 80px; }
            .nav-logo { font-size: 1.1rem; }
            .nav-center { gap: 6px; }
            .nav-center a { font-size: 0.85rem; padding: 4px 8px; }
            .hero-section { padding: 30px 0 50px 0; }
            .hero-top-layout { flex-direction: column-reverse; align-items: center; text-align: center; gap: 20px; }
            .hero-right-content { width: 120px; margin: 0 auto 10px auto; }
            .hero-main-row { justify-content: center; } 
            .hero-name { font-size: 3rem; } 
            .hero-slogan { font-size: 1.6rem; }
            .hero-desc { text-align: left; font-size: 1.05rem; } 
            
            /* 手机端讨论区按钮适配 */
            .hero-desc-row { flex-direction: column; align-items: center; gap: 24px; margin-bottom: 2.5rem; }
            .hero-desc-row .hero-desc { min-width: auto; width: 100%; text-align: left; }
            .discuss-btn { font-size: 2rem; padding: 10px 40px; }

            .hero-contact-card { padding: 1.5rem; gap: 1.2rem; flex-direction: column; align-items: center; text-align: center; }
            .card { padding: 20px; }
            .section-title { font-size: 1.5rem; }
            #back-to-top { width: 40px; height: 40px; bottom: 20px; right: 20px; font-size: 18px; }
        }

        /* =========================================================
           🌟 弹窗层 (Modal Overlay) 样式
           ========================================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 9, 15, 0.95); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-container {
            text-align: center; transform: translateY(30px) scale(0.95);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 95%; max-width: 1000px;
            max-height: 90vh; overflow-y: auto; 
            padding: 30px 20px;
            scrollbar-width: none;

        .reveal-section,
        .reveal-item {

            will-change: opacity, transform;
        }

        .reveal-section.is-visible,
        .reveal-item.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        .reveal-section .section-title {
            transition: opacity 620ms ease, transform 620ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .reveal-section:not(.is-visible) .section-title {
            opacity: 0;
            transform: translateY(18px);
        }

        .reveal-section.is-visible .section-title {
            opacity: 1;
            transform: translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {
            .reveal-section,
            .reveal-item,
            .reveal-section .section-title {
                opacity: 1 !important;
                transform: none !important;
                transition: none !important;
            }
        }

        @media print {
            body {
                background: #fff;
                color: #2e2824;
            }

            .navbar,
            #back-to-top,
            .hero-discuss-wrap,
            .modal-overlay,
            .lightbox-overlay {
                display: none !important;
            }

            .main-content {
                margin-top: 0;
            }

            .sticky-wrapper {
                height: auto;
                background: transparent;
            }

            .sticky-content {
                height: auto;
            }

            .role-cards-track {
                transform: none !important;
            }
        }
        .exp-card-new { content-visibility: auto; contain-intrinsic-size: 360px; }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <!-- 引入 Supabase JS 客户端 SDK -->

    <script>
        (function() {
            // ----- 简历数据 -----
            const resume = {
                basic: { name: "周帅杭", phone: "17638502317", email: "17638502317@163.com", wechat: "Zsh1762317", location: "河南省郑州市" },
                education: { school: "河南牧业经济学院", degree: "本科", major: "能源与动力工程", period: "2025.9 - 2029.7", courses: ["工程热力学", "流体力学", "传热学", "PLC应用技术"] },

                    { name: "小游戏开发", stack: "Trae编程 / JavaScript", result: "制作飞机大战、手势粒子特效小游戏，具备交互功能。", link: "#" },

                ],
                certificates: [ "人工智能训练师初级证书（阿里云认证）", "人工智能训练师高级证书（阿里云认证）" ],
                skills: {
                    languages: [{ name: "中文", level: 100 }, { name: "英文 (读写)", level: 70 }],
                    frameworks: [{ name: "Coze智能体", level: 85 }, { name: "Trae", level: 75 }, { name: "AI提示词", level: 90 }],
                    tools: [{ name: "剪映", level: 90 }, { name: "Word", level: 85 }, { name: "Excel", level: 80 }, { name: "PowerPoint", level: 85 }],
                    domains: [{ name: "回路接线", level: 75 }, { name: "数据分析", level: 70 }, { name: "内容运营", level: 85 }]
                }
            };

            const root = document.getElementById('root');
            function el(tag, className, innerHTML = '') {
                const element = document.createElement(tag);
                if (className) element.className = className;
                if (innerHTML) element.innerHTML = innerHTML;
                return element;
            }

            function renderNav() {
                const nav = document.createElement('nav');
                nav.className = 'navbar';
                nav.innerHTML = `
                    <div class="container nav-container">
                        <div class="nav-logo">ZSH<span>.</span></div>
                        <div class="nav-center">
                            <a href="#hero">首页</a>

                            <a href="#skills">技能</a>
                        </div>
                        <div class="nav-actions"><button class="icon-btn" id="printResume" title="打印简历">🖨️</button></div>
                    </div>
                `;
                return nav;
            }

            function renderHero() {
                const section = el('section', 'container hero-section', '');
                section.id = 'hero';
                const topLayout = el('div', 'hero-top-layout', '');
                
                const leftContent = el('div', 'hero-left-content', '');
                leftContent.style.maxWidth = '100%';
                
                const tag = el('div', 'hero-tag', 'P O R T F O L I O &nbsp; // &nbsp; V E R S I O N _ 2 . 0');
                const mainRow = el('div', 'hero-main-row', '');
                const nameWrap = el('div', 'title-wrap', `<h1 class="hero-name">${resume.basic.name}<span class="hero-dot">.</span></h1>`);
                
                // 🌟 核心优化 1：给首屏最重要的头像，设置优先级最高，取消懒加载，加上秒脱落的骨架屏
                const avatar = el('img', 'hero-avatar img-skeleton', ''); 
                avatar.src = '86af336cd3ed9a3598b78bfc2b6a09fc.jpg'; 
                avatar.alt = '个人头像';
                avatar.setAttribute('fetchpriority', 'high'); 
                avatar.setAttribute('decoding', 'async');
                avatar.onload = function() { this.classList.remove('img-skeleton'); };
                
                mainRow.append(nameWrap, avatar);
                
                const slogan = el('h2', 'hero-slogan', '向阳而生，步履不停。');

                const discussWrap = el('div', 'hero-discuss-wrap', `
                    <a href="javascript:void(0);" class="discuss-btn" onclick="openModal('discussModal')">讨论区</a>
                `);
                descRow.append(desc, discussWrap);
                
                leftContent.append(tag, mainRow, slogan, descRow);
                
                topLayout.append(leftContent);

                    <div class="contact-item"><span class="contact-label">手机号</span><span class="contact-val">${resume.basic.phone}</span></div>

        function renderHighlights() {
            const wrapper = el('section', 'sticky-wrapper', '');
            wrapper.id = 'highlights';
            
            const stickyContent = el('div', 'sticky-content', '');
            
            const innerContainer = el('div', 'sticky-container', '');
            innerContainer.innerHTML = '<h2 class="section-title">核心身份</h2>';
            
            const container = el('div', 'role-cards-container', '');
            const track = el('div', 'role-cards-track', '');
            
            const cardsData = [
                { id: "trigger-ai", num: "01", category: "人工智能开发", titleLine1: "AI+编程", titleLine2: "开发者", icon: "🤖", linkText: "探索项目库 ↗", themeClass: "tech-bg-1" },

                            <div class="tech-shape shape-2"></div>

                                <span>${data.num}00</span>
                                <span>1011</span>
                                <span>0110</span>

                        </div>
                        
                        <div class="role-card-overlay"></div>
                        <div class="role-card-content">

                            <h3 class="role-card-title">
                                <div style="display:flex; align-items:center; gap:8px;">
                                    <span style="font-size: 1.6rem; line-height:1;">${data.icon}</span>

                    `);
                    
                    if (data.id === 'trigger-ai') {
                        card.href = "javascript:void(0);";
                        card.onclick = (e) => { e.preventDefault(); openModal('aiModal'); };
                    } else if (data.id === 'trigger-ppt') {
                        card.href = "javascript:void(0);";
                        card.onclick = (e) => { e.preventDefault(); openModal('pptModal'); };

            // ==============================================================
            // 🌟 Supabase 数据库通信与提交逻辑
            // ==============================================================
            const supabaseUrl = 'https://uefwsneisirucxcflntg.supabase.co';
            const supabaseKey = 'sb_publishable_UQBZ3cHl_l7ye4vgcxJ-oA_jqkNAZc_';
            const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

            // 防注入小工具
            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/[&<>'"]/g, tag => ({
                    '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
                }[tag] || tag));
            }

            window.fetchFeedback = async function() {
                const listEl = document.getElementById('feedback-list');
                if(!listEl) return;
                
                try {
                    const { data, error } = await supabase
                        .from('portfolio_comments')
                        .select('display_name, content, created_at')
                        .order('created_at', { ascending: false })
                        .limit(15);

                    if (error) throw error;

                    if (data.length === 0) {
                        listEl.innerHTML = '<div class="comment-list-message">还没有评论，留下第一条吧。</div>';
                        return;
                    }

                    listEl.innerHTML = data.map(item => {
                        const dateObj = new Date(item.created_at);
                        const dateStr = dateObj.getFullYear() + '/' + (dateObj.getMonth()+1).toString().padStart(2, '0') + '/' + dateObj.getDate().toString().padStart(2, '0') + ' ' + dateObj.getHours().toString().padStart(2, '0') + ':' + dateObj.getMinutes().toString().padStart(2, '0');
                        
                        return `
                            <article class="comment-card">
                                <div class="comment-meta">
                                    <span class="comment-name">${escapeHTML(item.display_name)}</span>
                                    <time datetime="${escapeHTML(item.created_at)}">${dateStr}</time>
                                </div>
                                <p class="comment-content">${escapeHTML(item.content)}</p>
                            </article>
                        `;
                    }).join('');
                } catch (error) {
                    console.error('加载评论失败:', error);

            };

                    const { error } = await supabase

                    alert('评论已发布。');

                    fetchFeedback(); 
                    
                } catch (error) {
                    console.error('发布评论失败:', error);
                    alert('发布失败，请稍后再试。');
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            };

            const initAdvancedAnimations = () => {
                const track = document.querySelector('.role-cards-track');
                const wrapper = document.querySelector('.sticky-wrapper');
                const container = document.querySelector('.role-cards-container');
                
                if (!track || !wrapper || !container) return;

                let currentX = 0;
                let targetX = 0;

                const renderLoop = () => {
                    const rect = wrapper.getBoundingClientRect();
                    const windowHeight = window.innerHeight;
                    
                    const scrollableDistance = rect.height - windowHeight;
                    
                    let maxSlide = track.scrollWidth - container.clientWidth + 24; 
                    if (maxSlide < 0) maxSlide = 0;

                    if (scrollableDistance > 0) {
                        let progress = -rect.top / scrollableDistance;
                        progress = Math.max(0, Math.min(1, progress));
                        targetX = -(maxSlide * progress);
                    }

                    currentX += (targetX - currentX) * 0.06;
                    if (Math.abs(targetX - currentX) < 0.1) currentX = targetX;
                    track.style.setProperty('--scroll-x', `${currentX}px`);

                    requestAnimationFrame(renderLoop);
                };

                requestAnimationFrame(renderLoop);
            };


            function initDeferredImages() {
                const images = Array.from(document.querySelectorAll('img[data-src]:not(.modal-overlay img)'));
                const loadImage = (img) => {
                    if (!img.dataset.src) return;
                    img.src = img.dataset.src;
                    img.removeAttribute('data-src');
                };
                if (!('IntersectionObserver' in window)) {
                    images.forEach(loadImage);
                    return;
                }
                const observer = new IntersectionObserver((entries, currentObserver) => {
                    entries.forEach(entry => {
                        if (!entry.isIntersecting) return;
                        loadImage(entry.target);
                        currentObserver.unobserve(entry.target);
                    });
                }, { rootMargin: '300px 0px' });
                images.forEach(img => observer.observe(img));
            }
            function initScrollReveal() {
                const sections = Array.from(document.querySelectorAll('.main-content > section:not(.sticky-wrapper)'));
                const items = Array.from(document.querySelectorAll(
                    '.hero-contact-card, .role-card, .exp-card-new, #projects .card, #skills .card, .cert-img-wrap'
                ));

                document.body.classList.add('reveal-ready');

                sections.forEach((section, index) => {
                    section.classList.add('reveal-section');
                    section.style.setProperty('--reveal-delay', `${Math.min(index * 70, 280)}ms`);
                });

                items.forEach((item, index) => {
                    item.classList.add('reveal-item');
                    item.style.setProperty('--reveal-delay', `${Math.min((index % 4) * 90, 270)}ms`);
                });

                const reveal = (entry, observer) => {
                    if (!entry.isIntersecting) return;
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                };

                if (!('IntersectionObserver' in window)) {
                    sections.concat(items).forEach(node => node.classList.add('is-visible'));
                    return;
                }

                const sectionObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => reveal(entry, observer));
                }, {
                    threshold: 0.16,
                    rootMargin: '0px 0px -8% 0px'
                });

                const itemObserver = new IntersectionObserver((entries, observer) => {
                    entries.forEach(entry => reveal(entry, observer));
                }, {
                    threshold: 0.12,
                    rootMargin: '0px 0px -5% 0px'
                });

                sections.forEach(section => sectionObserver.observe(section));
                items.forEach(item => itemObserver.observe(item));

                const hero = document.querySelector('.hero-section');
                if (hero) hero.classList.add('is-visible');
            }

            setTimeout(() => {
                initAdvancedAnimations();
                initDeferredImages();
                initScrollReveal();
            }, 150);

        })();
